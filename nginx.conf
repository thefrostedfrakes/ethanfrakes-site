# Static server for the built React app. The only client is cloudflared on the
# internal Docker network (plus curl on the server itself via the loopback port),
# so TLS, HSTS, and caching at the edge are all handled by Cloudflare.

# Behind the tunnel every request comes from the cloudflared container; recover
# the real visitor IP for the access log from the header Cloudflare sets.
real_ip_header    CF-Connecting-IP;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  192.168.0.0/16;
set_real_ip_from  127.0.0.1;

# www -> apex, so there is one canonical URL (GitHub Pages used to do this).
server {
    listen 8080;
    server_name www.ethanfrakes.com;
    return 301 https://ethanfrakes.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name ethanfrakes.com _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Note: nginx does not inherit add_header into a location that sets its
    # own, so each location below repeats the headers it needs.

    # Container healthcheck (Dockerfile HEALTHCHECK / compose depends_on).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # CRA emits content-hashed filenames under /static, so they never change
    # in place and can be cached forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html (and other unhashed files) must revalidate so a redeploy is
    # picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The app uses HashRouter (/#/about), so real paths are only files;
        # fall back to index.html anyway in case that ever changes.
        try_files $uri $uri/ /index.html;
    }
}
